<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MotionDock legal information and privacy policy.">
  <title>MotionDock Legal</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 92, 255, 0.22), transparent 32rem),
        radial-gradient(circle at 85% 90%, rgba(61, 198, 255, 0.16), transparent 34rem),
        #09090b;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(24, 24, 27, 0.82);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(20px);
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 12px 36px rgba(124, 92, 255, 0.32);
    }

    h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 58px); letter-spacing: -0.045em; }
    p { margin: 0 0 32px; color: #a1a1aa; font-size: 18px; line-height: 1.65; }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #f4f4f5;
      color: #18181b;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover { background: #ffffff; transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid #38bdf8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>MotionDock</h1>
    <p>Legal information for MotionDock, a live wallpaper app for macOS.</p>
    <a href="./privacy/">Read the Privacy Policy <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
